<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Eccentric Souls in Unity (ESU)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            esu: {
              50: '#f0fdf4', 100: '#dcfce7', 400: '#4ade80', 500: '#22c55e',
              600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    .brand-panel {
      background: linear-gradient(160deg, rgba(15,19,28,0.90) 0%, rgba(22,101,52,0.80) 100%),
                  url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1400&q=80') center/cover;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row">

  <!-- Left: full-height brand panel -->
  <div class="brand-panel text-white w-full md:w-1/2 min-h-[40vh] md:min-h-screen p-8 md:p-12 flex flex-col justify-between">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-full bg-esu-500 flex items-center justify-center shadow-lg">
          <span class="text-white font-bold text-sm">ESU</span>
        </div>
        <span class="font-bold text-xl tracking-tight">ESU<span class="text-esu-400">.</span></span>
      </a>
      <a href="index.html" class="text-xs font-medium px-3.5 py-1.5 rounded-full border border-white/30 hover:bg-white/10 transition">
        Back to home ↗
      </a>
    </div>
    <div class="py-12 md:py-0">
      <p class="text-3xl md:text-4xl lg:text-5xl font-bold leading-tight max-w-md">
        A place where good people help each other
      </p>
      <p class="mt-4 text-white/75 text-base md:text-lg max-w-sm leading-relaxed">
        When you have, you give. When you need, you receive. No shame. No begging. Just Community.
      </p>
    </div>
    <p class="text-white/40 text-xs">Eccentric Souls in Unity · Margate, FL</p>
  </div>

  <!-- Right: full-height form panel -->
  <div class="w-full md:w-1/2 min-h-[60vh] md:min-h-screen bg-white flex items-center justify-center p-8 md:p-12 lg:p-16">
    <div class="w-full max-w-md">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Welcome back</h1>
      <p class="text-gray-500 mb-8">
        New to the Circle?
        <a href="join.html" class="text-esu-600 font-semibold hover:text-esu-700 underline underline-offset-2">Join now</a>
      </p>

      <form id="login-form" class="space-y-4">
        <input type="email" id="email" required placeholder="Email"
          class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-esu-500 focus:border-transparent transition" />
        <input type="password" id="password" required placeholder="Password"
          class="w-full px-4 py-3.5 rounded-xl bg-gray-50 border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-esu-500 focus:border-transparent transition" />

        <p id="form-error" class="hidden text-sm text-red-600 bg-red-50 px-4 py-3 rounded-xl"></p>

        <button type="submit" id="submit-btn"
          class="w-full py-3.5 rounded-xl bg-esu-600 text-white font-semibold text-base hover:bg-esu-700 transition shadow-md disabled:opacity-60">
          Sign in
        </button>
      </form>

      <div class="flex items-center gap-3 my-8">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 font-medium">Or continue with</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" disabled class="flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-500 bg-gray-50 cursor-not-allowed">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" disabled class="flex items-center justify-center gap-2 py-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-500 bg-gray-50 cursor-not-allowed">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Apple
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, doc, getDoc } from './js/firebase.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      const btn = document.getElementById('submit-btn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const cred = await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
        const snap = await getDoc(doc(db, 'members', cred.user.uid));
        if (snap.exists()) {
          const data = snap.data();
          localStorage.setItem('esu_member', JSON.stringify({ ...data, uid: cred.user.uid, joinedAt: new Date().toISOString() }));
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        let msg = 'Incorrect email or password.';
        if (err.code === 'auth/operation-not-allowed') msg = 'Enable Email/Password in Firebase Console.';
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
