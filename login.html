<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Eccentric Souls in Unity (ESU)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            esu: {
              50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-esu-600 flex items-center justify-center">
          <span class="text-white font-bold text-sm">ESU</span>
        </div>
        <span class="font-bold text-esu-800">Eccentric Souls in Unity</span>
      </a>
      <a href="join.html" class="text-sm font-medium text-esu-600 hover:text-esu-700">Join the Circle</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome back</h1>
        <p class="text-gray-600">Sign in to your Circle member account</p>
      </div>

      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 md:p-8">
        <form id="login-form" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-esu-500 focus:border-esu-500 outline-none" placeholder="you@example.com" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-esu-500 focus:border-esu-500 outline-none" placeholder="Your password" />
          </div>
          <p id="form-error" class="hidden text-sm text-red-600 bg-red-50 px-4 py-3 rounded-lg"></p>
          <button type="submit" id="submit-btn" class="w-full px-6 py-3 rounded-full bg-esu-600 text-white font-semibold hover:bg-esu-700 transition disabled:opacity-60">
            Sign in
          </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
          New to the Circle? <a href="join.html" class="text-esu-600 font-semibold hover:text-esu-700">Join now</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-sm text-gray-500">
    Eccentric Souls in Unity · Margate, FL
  </footer>

  <script type="module">
    import {
      auth, db,
      signInWithEmailAndPassword,
      doc, getDoc
    } from './js/firebase.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('form-error');
      const btn = document.getElementById('submit-btn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const snap = await getDoc(doc(db, 'members', cred.user.uid));
        if (snap.exists()) {
          const data = snap.data();
          localStorage.setItem('esu_member', JSON.stringify({
            ...data,
            uid: cred.user.uid,
            joinedAt: data.createdAt?.toDate?.()?.toISOString?.() || new Date().toISOString()
          }));
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error(err);
        let msg = 'Could not sign in. Check your email and password.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = 'Incorrect email or password.';
        }
        if (err.code === 'auth/operation-not-allowed') {
          msg = 'Email/Password sign-in is not enabled. Enable it in Firebase Console → Authentication → Sign-in method.';
        }
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
